<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herdr HUD mockup</title>
<!-- Static preview of the real panel with placeholder agents. Nothing here talks
     to Herdr or to any agent; a fake bridge answers the panel's requests. -->
<link rel="stylesheet" href="../../Sources/HerdrHUD/Resources/style.css">
<link rel="stylesheet" href="mockup.css">
</head><body class="mockup">
<div class="game" aria-hidden="true"><div class="sun"></div><div class="hills"></div><div class="hills near"></div><div class="unitframe"><b>Thrall</b><i></i><i class="mana"></i></div><div class="actionbar"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
<div class="controls"><label><input type="checkbox" id="glass" checked> Glass (macOS)</label><label><input type="checkbox" id="game" checked> Game backdrop</label></div>
<div class="frame">
<header><div class="brand" aria-hidden="true"><span class="mark">H</span><span class="word">herdr</span><span class="tag">HUD</span></div><div id="summary" aria-label="Agent states"></div><div id="machines" aria-label="Machine connections"></div><div class="spacer"></div><button id="refresh" class="icon" title="Refresh agents" aria-label="Refresh agents"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button><button id="hide" class="icon" title="Hide the HUD, including H. Restore it from the menu bar or tray icon." aria-label="Hide HUD"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4Z"/><circle cx="8" cy="8" r="1.8"/><path d="M2.5 13.5l11-11"/></svg></button><button id="close" class="icon" title="Close panel (Esc)" aria-label="Close agent panel"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></header>
<div id="notice" role="status" hidden></div>
<main><aside><div class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="search" type="search" placeholder="Find an agent" aria-label="Find an agent"><kbd>/</kbd></div><div class="roster-heading"><span>Agents</span><span id="count">0</span></div><div id="roster"></div></aside><div id="divider" role="separator" aria-label="Resize agent roster" tabindex="0"></div>
<section class="conversation"><div class="conversation-header"><div class="conversation-title"><strong id="title">Your agents will appear here</strong><div id="identity" class="subtitle">Uses the machines already configured in Herdr</div></div><div class="spacer"></div><div class="switch" role="group" aria-label="View"><button id="chat" aria-pressed="true">Chat</button><button id="terminal" aria-pressed="false">Terminal</button></div></div><div id="working" hidden><span class="spark" aria-hidden="true"></span><span id="work-text">Working…</span><span id="work-time"></span></div><div id="output" tabindex="0" aria-label="Agent output"><div class="empty"><div class="empty-h">H</div><h2>Your agents, one keystroke away.</h2><p>Select an agent to read its latest output.<br>Your game stays right where it is.</p></div></div>
<div id="composer"><div id="send-status" role="status">Choose an agent to get started.</div><div class="input"><span class="caret" aria-hidden="true">❯</span><textarea id="prompt" placeholder="Tell your agent what’s next" aria-label="Prompt to selected agent" title="Enter sends. Shift+Enter adds a new line." rows="2"></textarea><button id="send" disabled title="Send (Enter)" aria-label="Send prompt"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button></div><div class="composer-actions"><div id="chips" aria-label="Agent status line"></div><div id="hint"><span><kbd>Enter</kbd> send</span><span><kbd id="mod">Alt</kbd><kbd>↑</kbd><kbd>↓</kbd> agents</span><span><kbd>Esc</kbd> close</span></div></div><button id="reconcile" hidden>I checked Herdr. Allow another send</button></div></section></main>
</div>
<script src="fixtures.js"></script>
<script src="../../Sources/HerdrHUD/Resources/model.js"></script>
<script src="../../Sources/HerdrHUD/Resources/render.js"></script>
<script src="../../Sources/HerdrHUD/Resources/app.js"></script>
<script src="mockup.js"></script>
</body></html>
